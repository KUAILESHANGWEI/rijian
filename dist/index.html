<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#456454"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23456454'/%3E%3Ctext x='4' y='42' font-size='27' fill='%23f7f5ef'%3E日缄%3C/text%3E%3C/svg%3E"><title>日缄 · 记住重要日子</title><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="brand">日缄</div><p class="tagline">记住每一个重要日子</p><button id="manage-groups" class="manage-groups">管理分组</button><nav id="categories" aria-label="分组"></nav><button id="settings" class="settings">⚙ &nbsp; 备份与设置</button></aside>
<main><header><p id="today"></p><div class="heading"><h1>值得期待的日子</h1><button id="add" class="primary">＋ 记一笔</button></div></header><section id="featured" aria-label="下一个重要日子"></section><section class="toolbar"><input id="search" type="search" placeholder="搜索日子" aria-label="搜索日子"><div id="tabs" role="group" aria-label="日期筛选"><button data-tab="all" class="selected">全部</button><button data-tab="future">即将到来</button><button data-tab="past">已经过去</button></div></section><section id="events" aria-label="日子清单"></section><footer>数据保存在当前浏览器中，建议定期导出备份。<span id="reminder-status"></span></footer></main>
<dialog id="editor"><form id="event-form"><div class="dialog-heading"><h2 id="editor-title">记一笔</h2><button type="button" class="close" aria-label="关闭">×</button></div><input type="hidden" name="id"><label>日子名称<input name="title" required maxlength="100" placeholder="想记住的日子"></label><div class="form-grid"><div class="emoji-field"><label for="emoji-input">表情</label><div class="emoji-control"><input id="emoji-input" name="emoji" maxlength="12" value="🌿"><button type="button" id="emoji-toggle" aria-expanded="false" aria-controls="emoji-picker">选择表情</button></div></div><label>分组<input name="label" list="label-options" required value="纪念日" maxlength="30"><datalist id="label-options"></datalist></label></div><section id="emoji-picker" hidden aria-label="表情库"><div id="emoji-categories" role="group" aria-label="表情分类"></div><div id="emoji-grid"></div></section><label>公历日期与时间<input name="date" type="datetime-local" required min="1900-01-01T00:00" max="2100-12-31T23:59"></label><label class="check"><input name="isLunar" type="checkbox"> 使用农历日期</label><div id="lunar-fields" class="form-grid" hidden><label>农历月<input name="lunarMonth" type="number" min="1" max="12" value="1"></label><label>农历日<input name="lunarDay" type="number" min="1" max="30" value="1"></label><label class="check"><input name="isLunarLeap" type="checkbox"> 闰月</label></div><div class="form-grid"><label>重复<select name="repeatType"><option>从不</option><option>每周</option><option>每月</option><option>每年</option></select></label><label>提前提醒<select name="reminderMinutes"><option value="-1">关闭</option><option value="0">当天准时</option><option value="60">提前 1 小时</option><option value="1440">提前 1 天</option><option value="10080">提前 1 周</option></select></label></div><label>备注<textarea name="notes" rows="3" maxlength="10000" placeholder="留一句话给未来的自己"></textarea></label><p id="form-error" class="error" role="alert"></p><div class="form-actions"><button type="button" id="delete" class="danger">删除</button><button type="button" id="archive">归档</button><button type="submit" class="primary">保存日子</button></div></form></dialog>
<dialog id="preferences"><div class="dialog-heading"><h2>备份与设置</h2><button class="close" aria-label="关闭">×</button></div><h3>给日子留一份备份</h3><p>支持导入「日缄」及原 Android 版的 JSON 备份。导入会合并事件，重复导入会自动去重。</p><div class="settings-actions"><button id="export" class="primary">导出备份</button><button id="import">导入备份</button><input id="file" type="file" accept=".json,application/json" hidden></div><h3>提醒</h3><p>页面打开时检查到期提醒。浏览器关闭、设备休眠或后台限流时，无法保证准时送达。</p><button id="permission">开启浏览器通知</button><p id="permission-status"></p><h3>本地数据</h3><p>清除浏览器数据会同时清除日子。附件字段会随备份保留，Android 本地附件路径无法在网页中打开。</p><button id="clear" class="danger">清空所有日子</button></dialog><dialog id="groups"><div class="dialog-heading"><h2>管理分组</h2><button class="close" aria-label="关闭">×</button></div><p class="group-hint">重命名会同步更新组内日子。删除分组后，日子移至“未分组”。</p><div id="group-list"></div><form id="new-group-form" class="new-group"><input name="name" aria-label="新分组名称" placeholder="新分组名称" maxlength="30" required><button class="primary">新增分组</button></form><p id="group-error" class="error" role="alert"></p></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
